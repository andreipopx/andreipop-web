name = "andreipop-api"
main = "src/index.ts"
compatibility_date = "2026-09-07"
compatibility_flags = ["nodejs_compat"]

# KV namespace para todos los datos (firmas, reacciones, comentarios).
# Namespace ID confirmado por el usuario.
[[kv_namespaces]]
binding = "DATA"
id = "bcabab9223e04cd2ac2218a46fab4966"

# Vars públicas (site key del Turnstile no es sensible).
[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAEr9hGhp4o0sSfMd"
ALLOWED_ORIGIN = "https://andreipop.org"

# Secretos (se añaden con `wrangler secret put`):
# - TURNSTILE_SECRET_KEY
